<!doctype html>
<html lang="en" class="is-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moiz Web Solutions</title>
    <meta name="description" content="Premium web design and development studio." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="image" href="./src/assets/images/main-logo.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700&family=Inter:wght@300;400;500;600&family=Outfit:wght@200;300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Critical boot CSS: centered lockup + wordmark unroll. Dismiss is timer-driven (see appBoot.js). -->
    <style>
      html {
        background: #f7f6f2;
      }
      html.dark {
        background: #0b1018;
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-width: 320px;
        background: #f7f6f2;
      }
      html.dark body {
        background: #0b1018;
      }
      body.is-loading {
        overflow: hidden;
      }
      body.is-loading #root {
        pointer-events: none !important;
      }
      body.is-loading:not(.is-handoff) #root {
        visibility: hidden !important;
      }

      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f6f2;
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transition:
          opacity 0.45s ease-in,
          visibility 0.45s ease-in;
      }
      html.dark #loading-screen {
        background: #0b1018;
      }
      #loading-screen.is-hiding {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .boot-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: transparent;
      }

      .boot-lockup {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .boot-logo {
        display: block;
        height: clamp(3.25rem, 8vw, 5rem);
        width: auto;
        aspect-ratio: 1293 / 935;
        object-fit: contain;
        background: transparent;
        transform-origin: center center;
        animation: boot-logo-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      .boot-wordmark {
        display: grid;
        grid-template-columns: 0fr;
        animation: boot-wordmark-open 0.72s ease-out 0.36s forwards;
      }

      .boot-wordmark-clip {
        min-width: 0;
        overflow: hidden;
      }

      .boot-wordmark-track {
        display: block;
        padding-left: 0.7rem;
        white-space: nowrap;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: clamp(1.0625rem, 3.1vw, 1.5rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.03em;
        clip-path: inset(0 100% 0 0);
        transform: translateX(-8px);
        animation: boot-wordmark-unroll 0.72s ease-out 0.36s forwards;
      }

      .boot-wordmark-ink {
        color: #111820;
      }
      .boot-wordmark-blue {
        color: #2563eb;
      }
      html.dark .boot-wordmark-ink {
        color: rgba(255, 255, 255, 0.9);
      }
      html.dark .boot-wordmark-blue {
        color: #2563eb;
      }

      .boot-spinner-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 18px;
        opacity: 0;
        animation: boot-spinner-in 0.35s ease-out 1.05s forwards;
      }

      .boot-spinner {
        display: block;
        width: 28px;
        height: 28px;
        animation: boot-spinner-spin 1.1s linear infinite;
      }
      .boot-spinner-track {
        fill: none;
        stroke: rgba(17, 24, 32, 0.12);
        stroke-width: 2.25;
      }
      html.dark .boot-spinner-track {
        stroke: rgba(255, 255, 255, 0.14);
      }
      .boot-spinner-arc {
        fill: none;
        stroke: #ffc20e;
        stroke-width: 2.25;
        stroke-linecap: round;
        stroke-dasharray: 48 21;
      }

      @keyframes boot-logo-in {
        from {
          opacity: 0;
          transform: scale(0.88);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes boot-wordmark-open {
        from {
          grid-template-columns: 0fr;
        }
        to {
          grid-template-columns: 1fr;
        }
      }

      @keyframes boot-wordmark-unroll {
        from {
          clip-path: inset(0 100% 0 0);
          transform: translateX(-8px);
        }
        to {
          clip-path: inset(0 0 0 0);
          transform: translateX(0);
        }
      }

      @keyframes boot-spinner-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes boot-spinner-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 600px) {
        .boot-wordmark-track {
          padding-left: 0.55rem;
        }
        .boot-spinner-wrap {
          margin-top: 16px;
        }
        .boot-spinner {
          width: 24px;
          height: 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-logo,
        .boot-wordmark,
        .boot-wordmark-track,
        .boot-spinner-wrap,
        .boot-spinner {
          animation: none !important;
        }
        .boot-logo {
          opacity: 1;
          transform: none;
        }
        .boot-wordmark {
          grid-template-columns: 1fr;
        }
        .boot-wordmark-track {
          clip-path: none;
          transform: none;
        }
        .boot-spinner-wrap {
          opacity: 1;
        }
      }
    </style>
    <script>
      (function () {
        var STORAGE_KEY = 'mws-theme';
        var stored = localStorage.getItem(STORAGE_KEY);
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved =
          stored === 'light' ? 'light' : stored === 'dark' ? 'dark' : systemDark ? 'dark' : 'light';
        if (resolved === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.dataset.theme = resolved;
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body class="is-loading">
    <div
      id="loading-screen"
      role="status"
      aria-live="polite"
      aria-label="Loading"
      aria-busy="true"
    >
      <div class="boot-loader">
        <div class="boot-lockup">
          <img
            id="boot-logo"
            class="boot-logo logo-mark"
            src="./src/assets/images/main-logo.png"
            width="1293"
            height="935"
            alt=""
            aria-hidden="true"
            fetchpriority="high"
            decoding="async"
          />
          <div class="boot-wordmark" aria-hidden="true">
            <div class="boot-wordmark-clip">
              <span class="boot-wordmark-track">
                <span class="boot-wordmark-ink">Moiz</span><span class="boot-wordmark-blue">Web</span><span class="boot-wordmark-ink">Solutions</span>
              </span>
            </div>
          </div>
        </div>
        <div class="boot-spinner-wrap">
          <svg class="boot-spinner" viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
            <circle class="boot-spinner-track" cx="14" cy="14" r="11" />
            <circle class="boot-spinner-arc" cx="14" cy="14" r="11" />
          </svg>
        </div>
      </div>
    </div>
    <div id="root" inert></div>
    <script>
      (function () {
        var FAILSAFE_MS = 2800;
        var FADE_MS = 450;
        window.setTimeout(function () {
          if (window.__mwsBootDismissed) return;
          window.__mwsBootDismissed = true;
          var loader = document.getElementById('loading-screen');
          var root = document.getElementById('root');
          var body = document.body;
          document.documentElement.classList.remove('is-booting');
          body.classList.remove('is-loading', 'is-handoff', 'is-logo-handoff');
          body.style.overflow = '';
          if (root) {
            root.removeAttribute('inert');
            root.style.visibility = '';
            root.style.pointerEvents = '';
          }
          if (!loader) return;
          loader.classList.add('is-hiding');
          loader.style.opacity = '0';
          loader.style.visibility = 'hidden';
          loader.style.pointerEvents = 'none';
          loader.setAttribute('aria-busy', 'false');
          loader.setAttribute('aria-hidden', 'true');
          window.setTimeout(function () {
            if (loader.parentNode) loader.remove();
          }, FADE_MS);
        }, FAILSAFE_MS);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
